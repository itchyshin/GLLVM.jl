# Standalone project for the GLLVM.jl ↔ R gllvmTMB parity suite.
#
# This project is INTENTIONALLY SEPARATE from test/Project.toml.
# RCall requires a working R installation and cannot be precompiled on CI
# runners that lack R. Adding it here — not to test/Project.toml — means
# the default test suite (`julia --project=. test/runtests.jl`) never
# touches this project and will never break because of R absence.
#
# GLLVM *is* listed in [deps] below, with the package's own UUID taken from the
# root Project.toml. `runparity.jl` still calls `Pkg.develop(path="../..")` at
# runtime — that is what points the (gitignored) Manifest at this working tree,
# since GLLVM is unregistered and Julia 1.10 has no `[sources]` support.
#
# Why the dep is declared here rather than left implicit (2026-08-24):
# `Pkg.develop` used to ADD the entry itself on every run, and Pkg rewrites a
# Project.toml whenever it changes one — which silently deleted this entire
# comment block and left the tracked file dirty after every parity run. With the
# entry already present, `Pkg.develop` has nothing to change in this file, so it
# only touches the Manifest and these comments survive.
#
# The earlier note here said a listed UUID "may not match across machines /
# worktrees". That concern is unfounded: a package UUID is a stable property of
# the package, declared once in its own Project.toml, and is identical on every
# machine and in every worktree. Only the *path* varies, and the path lives in
# the Manifest (gitignored), not here.

[deps]
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
GLLVM = "2dc8e01c-4f48-4476-aaae-e919b4a30df7"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
RCall = "6f49c342-dc21-5d91-9882-a32aef131414"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[compat]
Distributions = "0.25"
RCall = "0.13, 0.14"
julia = "1.10"
